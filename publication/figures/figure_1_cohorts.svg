   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(55.827422 57.141829)">ClinVar June 2024 labels</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(33.467344 69.330501)">48,197 variants | 16,740 positives</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(37.53 81.769485)">4,692 genes | 3,718 split groups</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23658b" x="316.89" y="42.318853" transform="rotate(-0 316.89 42.318853)">Later clinical cohort</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(270.998438 57.141829)">ClinVar August 2026</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(242.790469 69.330501)">14,650 variants | 7,323 positives</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(230.8275 81.769485)">3,059 genes | exact variants excluded</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23658b" x="110.43" y="155.638213" transform="rotate(-0 110.43 155.638213)">Original nested comparison</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(48.320859 170.770564)">5 outer folds x 3 inner folds</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(33.381563 182.900173)">Fit, stop, calibration and threshold</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(28.875938 195.029783)">partitions separate from test groups</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23658b" x="316.89" y="155.638213" transform="rotate(-0 316.89 155.638213)">Clinical transfer</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(255.559922 170.770564)">92.01% structure coverage</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(246.894609 182.900173)">98.54% conservation coverage</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(236.117813 195.029783)">679 variants in gene-disjoint subset</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #428165" x="110.43" y="264.910453" transform="rotate(-0 110.43 264.910453)">Later exploratory controls</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(53.675156 278.019244)">8 models x 5 frozen folds</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(43.466484 290.148853)">Shared scalar and ESM inputs</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(36.726328 302.278463)">Clinical cohort already inspected</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #815f95" x="316.89" y="264.910453" transform="rotate(-0 316.89 264.910453)">Separate functional endpoint</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(253.107422 279.893992)">696,311 single substitutions</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(258.925078 292.082664)">217 assays | 186 proteins</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(260.178047 304.462586)">No main-cohort structure</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(253.6425 316.592195)">or conservation annotations</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="213.66" y="363.34656" transform="rotate(-0 213.66 363.34656)">Covariates: dbNSFP 5.3a | UniProt January 2026 | AlphaFold v6</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #444444" x="213.66" y="385.201008" transform="rotate(-0 213.66 385.201008)">Label-temporal evaluation does not reconstruct all historical covariates.</text>
