   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23658b" x="106.3008" y="41.187877" transform="rotate(-0 106.3008 41.187877)">Sequence score s</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(29.338144 61.054473)">Masked alternate minus reference</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(32.727206 73.184082)">log probability from frozen ESM2</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #23658b" x="321.0192" y="41.187877" transform="rotate(-0 321.0192 41.187877)">Monotonic anchor</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(285.964903 61.054473)">b - softplus(a) s</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(246.268575 73.184082)">Positive slope on deleteriousness</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #815f95" x="106.3008" y="153.731077" transform="rotate(-0 106.3008 153.731077)">Residual inputs</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(27.2358 167.532868)">Masked residue vector and context</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(32.378456 179.662477)">Local structure and conservation</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(27.390488 191.792087)">Encoded into a bounded correction</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #428165" x="321.0192" y="149.850277" transform="rotate(-0 321.0192 149.850277)">Quality and availability gate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(266.1417 169.229663)">g = availability x quality</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(288.322481 181.359273)">x learned gate</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(253.306856 193.488882)">g = 0 if both auxiliary sources</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(291.78045 205.618492)">are unusable</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #626b72" x="213.66" y="270.155077" transform="rotate(-0 213.66 270.155077)">Fused logit</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(157.716563 282.016468)">z = anchor + g c tanh(h)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(118.960313 294.146077)">When g = 0, the model returns its anchor.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(109.879453 306.275687)">A separate calibrator and threshold still apply.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="213.66" y="364.62168" transform="rotate(-0 213.66 364.62168)">Controls remove the learned gate, continuity, dropout or residual bound.</text>
   </g>
  </g>
